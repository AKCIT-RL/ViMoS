# ─────────────────────────────────────────────────────────────────────────────
# DYSNM — Docker Compose (single file at repo root)
#
# GENMO + GMR (default): do not run `docker compose up` for the full pipeline.
# The orchestrator scripts/run_pipeline_docker.py invokes:
#   docker compose run --rm genmo <command>
#   docker compose run --rm gmr   <command>
#
# Optional stacks (profiles — not built unless you pass --profile):
#   docker compose --profile wbt  build | run   # whole_body_tracking (Isaac Lab)
#   docker compose --profile mtc  build | run   # motion_tracking_controller (ROS 2)
#
# Build:
#   docker compose build                          # genmo + gmr only
#   docker compose --profile wbt build            # + whole-body-tracking
#   docker compose --profile mtc build            # + motion-tracking-controller
#   docker compose build genmo
#   docker compose build gmr
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── GENMO: video → SMPL-X (requires GPU) ────────────────────────────────────
  genmo:
    build:
      context: ./GENMO
      dockerfile: Dockerfile
    image: copycat-genmo:latest
    working_dir: /app

    volumes:
      # GENMO checkpoints and other inputs (read-only)
      - ./GENMO/inputs:/app/inputs:ro
      # GENMO outputs — shared with the gmr service
      - ./GENMO/outputs:/app/outputs
      # HuggingFace model cache — persisted on the host to avoid re-downloading
      - ./GENMO/hf_cache:/hf_cache

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - CUDA_VISIBLE_DEVICES=0
      - HYDRA_FULL_ERROR=1
      # Persistent cache mounted from the host (avoids re-downloading models)
      - HF_HOME=/hf_cache
      - TRANSFORMERS_CACHE=/hf_cache
      - HUGGINGFACE_HUB_CACHE=/hf_cache
      - MPLCONFIGDIR=/tmp/matplotlib
      - XDG_CACHE_HOME=/tmp/.cache
      - YOLO_CONFIG_DIR=/tmp/ultralytics

    # GPU: requires Docker 19.03+ with nvidia-container-toolkit
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    # Relaxed IPC for PyTorch DataLoader shared memory
    ipc: host
    stdin_open: false
    tty: false

  # ── GMR: SMPL-X → robot motion (headless via EGL) ───────────────────────────
  gmr:
    build:
      context: ./GMR
      dockerfile: Dockerfile
    image: copycat-gmr:latest
    working_dir: /app

    volumes:
      # Robot assets and SMPL-X body models (read-only)
      - ./GMR/assets:/app/assets:ro
      # PKL and CSV outputs
      - ./GMR/output:/app/output
      # Visualization videos (optional)
      - ./GMR/videos:/app/videos
      # GENMO outputs read by GMR (read-only)
      - ./GENMO/outputs:/genmo_outputs:ro

    environment:
      # Offscreen EGL with GPU — no GLFW, no display required
      - MUJOCO_GL=egl

    # GPU for EGL offscreen rendering (mj.Renderer — no GLFW/viewer)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

    stdin_open: false
    tty: false

  # ── whole_body_tracking: Isaac Lab / BeyondMimic (profile wbt) ─────────────
  whole-body-tracking:
    profiles: [wbt]
    build:
      context: ./whole_body_tracking
      dockerfile: Dockerfile
    image: whole-body-tracking:latest
    working_dir: /workspace/whole_body_tracking
    runtime: nvidia
    network_mode: host
    stdin_open: true
    tty: true

    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - ACCEPT_EULA=Y
      - PRIVACY_CONSENT=Y

    volumes:
      - isaac-cache-kit:/isaac-sim/kit/cache
      - isaac-cache-ov:/root/.cache/ov
      - isaac-cache-pip:/root/.cache/pip
      - isaac-cache-gl:/root/.cache/nvidia/GLCache
      - isaac-cache-compute:/root/.nv/ComputeCache
      - isaac-logs:/root/.nvidia-omniverse/logs
      - isaac-data:/root/.local/share/ov/data
      - ./whole_body_tracking/logs:/workspace/whole_body_tracking/logs

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── motion_tracking_controller: ROS 2 Jazzy (profile mtc) ───────────────────
  motion-tracking-controller:
    profiles: [mtc]
    build:
      context: ./motion_tracking_controller
      dockerfile: Dockerfile
    image: motion-tracking-controller:latest
    network_mode: host
    stdin_open: true
    tty: true

    environment:
      - DISPLAY=${DISPLAY:-:0}

    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Optional: place policy.onnx here or mount another path at run time
      - ./motion_tracking_controller/data:/workspace/data

volumes:
  isaac-cache-kit:
  isaac-cache-ov:
  isaac-cache-pip:
  isaac-cache-gl:
  isaac-cache-compute:
  isaac-logs:
  isaac-data:
