defaults:
  # pytorch-lightning
  - data: ???
  - model: ???
  - /text_encoder@model.model_cfg.text_encoder: t5_3b
  - callbacks: null

  # system
  - hydra: default

  # utility groups that changes a lot
  - pipeline: null
  - network: null
  - optimizer: null
  - scheduler: null
  - train_datasets: null
  - test_datasets: null
  - endecoder: null # normalize/unnormalize data
  - refiner: null

  # global-override
  - exp: mixed # set "data, model and callbacks" in yaml
  - global/task: null # dump/test
  - global/hsearch: null # hyper-param search
  - global/debug: null # debug mode
  - _self_

# ================================ #
#          global setting          #
# ================================ #


# expirement information
task: fit # [fit, predict]
exp_name_base: ???
exp_name_var: ""
exp_name: ${exp_name_base}_${exp_name_var}
data_name: ???

# utilities in the entry file
# output_dir: "outputs/${data_name}/${exp_name}"
resume_mode: null
seed: 42

version: null
ckpt_dir: outputs/${data_name}/${exp_name}/
remote_results_path: /lustre/fsw/portfolios/nvr/projects/nvr_torontoai_humanmotionfm/workspaces/motiondiff/motiondiff_results/jiefengl/gvhmr
ckpt_path: null

use_wandb: true
rsync_ckpt: true


# ================================ #
#          global setting          #
# ================================ #

video_name: ???
output_root: outputs/demo
output_dir: "${output_root}/${text1_video_name}"
preprocess_dir: ${output_dir}/preprocess
video_path: "${output_dir}/0_input_video.mp4"

# Options
text1: null
text1_file: null
text1_video_path: null
text1_video_name: null
text_length: 300
static_cam: False
verbose: False
pose: false

# Video input options
video1_path: null
video1_name: null
static_cam1: False
orig_fps1: 30
video2_path: null
video2_name: null
static_cam2: False
orig_fps2: 30

# Music input options
# music_path: path to a WAV/MP3/FLAC audio file
# music_duration: clip length in seconds (null = full file)
# music_fps: feature extraction / output frame rate (must match motion fps = 30)
music_path: null
music_duration: null
music_fps: 30

paths:
  bbx: ${preprocess_dir}/bbx.pt
  bbx_xyxy_video_overlay: ${preprocess_dir}/bbx_xyxy_video_overlay.mp4
  vit_features: ${preprocess_dir}/vit_features.pt
  vimo_pred: ${preprocess_dir}/vimo_pred.pt
  vitpose: ${preprocess_dir}/vitpose.pt
  vitpose_video_overlay: ${preprocess_dir}/vitpose_video_overlay.mp4
  hmr4d_results: ${output_dir}/hmr4d_results.pt
  incam_video: ${output_dir}/1_incam.mp4
  global_video: ${output_dir}/2_global.mp4
  incam_global_horiz_video: ${output_dir}/3_incam_global_horiz.mp4
  slam: ${preprocess_dir}/camera.npy
  # Video 1 paths
  bbx1: ${preprocess_dir}/bbx1.pt
  bbx_xyxy_video_overlay1: ${preprocess_dir}/bbx_xyxy_video_overlay1.mp4
  vit_features1: ${preprocess_dir}/vit_features1.pt
  vimo_pred1: ${preprocess_dir}/vimo_pred1.pt
  vitpose1: ${preprocess_dir}/vitpose1.pt
  vitpose_video_overlay1: ${preprocess_dir}/vitpose_video_overlay1.mp4
  slam1: ${preprocess_dir}/camera1.npy
  incam_video1: ${output_dir}/1_incam1.mp4
  # Video 2 paths
  bbx2: ${preprocess_dir}/bbx2.pt
  bbx_xyxy_video_overlay2: ${preprocess_dir}/bbx_xyxy_video_overlay2.mp4
  vit_features2: ${preprocess_dir}/vit_features2.pt
  vimo_pred2: ${preprocess_dir}/vimo_pred2.pt
  vitpose2: ${preprocess_dir}/vitpose2.pt
  vitpose_video_overlay2: ${preprocess_dir}/vitpose_video_overlay2.mp4
