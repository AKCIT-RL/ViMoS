[project]
name = "genmo"
version = "1.0.0"
description = "GENMO: A GENeralist Model for Human MOtion"
authors = [
    {name = "NVIDIA Digital Human AI Research"}
]
requires-python = ">=3.10,<3.13"
readme = "README.md"
license = {text = "See LICENSE file"}

dependencies = [
    # PyTorch (instalado via extra-index-url)
    "torch==2.3.0+cu121",
    "torchvision==0.18.0+cu121",
    "timm==0.6.7",
    # Lightning + Hydra
    "lightning==2.3.0",
    "hydra-core==1.3",
    "hydra-zen",
    "hydra-colorlog",  # Note: package name uses hyphen, import uses underscore
    "rich",
    # Common utilities
    "numpy==1.23.5",
    "jupyter",
    "matplotlib",
    "ipdb",
    "setuptools>=68.0",
    "black",
    "tensorboardX",
    "opencv-python",
    "ffmpeg-python",
    "scikit-image",
    "termcolor",
    "einops",
    "imageio==2.34.1",
    "av==13.0.0",  # imageio[pyav], improved performance over imageio[ffmpeg]
    "joblib",
    # 3D-Vision
    "trimesh",
    "chumpy",
    "smplx",
    "wis3d",
    # 2D-Pose
    "ultralytics==8.2.42",  # YOLO
    "cython-bbox",
    "lapx",
    # motiondiff
    "lmdb==1.4.1",
    "transformers==4.30.2",
    "wandb==0.17.0",
    "sentencepiece==0.2.0",
    "pre-commit",
    "open3d",
]

[project.optional-dependencies]
dev = [
    "black",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = {find = {}}

# UV configuration for extra-index-url and special dependencies
[tool.uv]
extra-index-url = [
    "https://download.pytorch.org/whl/cu121",
]

[tool.uv.sources]
# pytorch3d com URL direta (wheel específico para Python 3.10, CUDA 12.1, PyTorch 2.3.0)
pytorch3d = { url = "https://dl.fbaipublicfiles.com/pytorch3d/packaging/wheels/py310_cu121_pyt230/pytorch3d-0.7.6-cp310-cp310-linux_x86_64.whl" }

[tool.uv.extra-build-dependencies]
# chumpy precisa de pip durante o build
chumpy = ["pip"]

